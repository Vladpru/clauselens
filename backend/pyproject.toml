[project]
name = "contract-review-backend"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Vladyslav Prysiazhniuk", email = "vladllen96681@gmail.com" }
]
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi>=0.165.0",
    "fastembed>=0.9.1",
    "langchain>=1.5.2",
    "langchain-openrouter>=0.3.0",
    "langchain-qdrant>=1.1.0",
    "langgraph>=1.2.24",
    "langgraph-checkpoint-postgres>=3.2.1",
    "psycopg[binary,pool]>=3.3.9",
    "pydantic-settings>=2.16.3",
    "pymupdf>=2.1",
    "python-multipart>=0.0.34",
    "pyyaml>=6.0.4",
    "qdrant-client>=1.20.0",
    "sqlmodel>=0.0.50",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "ruff>=0.17.6",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
